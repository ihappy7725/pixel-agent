<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pixel Office</title>
<!--
  뉴욕 트레이드타워 픽셀 오피스 — 서브에이전트 실시간 뷰어
  레퍼런스: assets/1.jpeg(미니어처 도시) · 2.jpeg(복셀 타일 디오라마) · 3.jpeg(코지 오피스) · 4.jpeg(맨해튼 거리)
  - 화면에만 그려요. 기록(CSV) · API 키 · Gemini 와는 아무 상관이 없어요.
  - 바깥 화면(app.py)의 탭 전환 · 버튼 누름을 '읽기만' 해서 에이전트 모션으로 바꿔요.
-->
<style>
@import url("https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css");
/* color-scheme 을 바깥 화면과 같게 두어야 iframe 바탕이 검게 칠해지지 않고 투명해요 */
html, body { margin: 0; padding: 0; background: transparent; color-scheme: normal; overflow: hidden; }
#stage {
  position: relative;
  width: min(100%, 705px);
  aspect-ratio: 3 / 2;
  margin: 0 auto;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#ui {
  position: absolute; left: 0; top: 0;
  width: 384px; height: 256px;
  transform-origin: 0 0;
  pointer-events: none;
  font-family: "Galmuri9", "Galmuri11", monospace;
  color: #F5EEFF;
  -webkit-font-smoothing: none;
}
/* 왼쪽 위 안내판 */
#hud { position: absolute; left: 6px; top: 6px; font-size: 6px; line-height: 9px; text-shadow: 1px 1px 0 #0D0E33; }
#hud b { font-family: "Galmuri11", monospace; font-weight: normal; color: #F7B731; font-size: 7px; }
#hud .live { color: #FF5A6E; }
#hud .live i { font-style: normal; animation: blink 1s steps(1) infinite; }
/* 벽에 단 출근 현황판 (왼쪽 벽 기울기에 맞춰 비스듬히) */
#board {
  position: absolute;
  transform-origin: 0 0;
  transform: skewY(-26.565deg);
  box-sizing: border-box;
  padding: 3px 4px;
  font-size: 5px; line-height: 7.4px;
  color: #DCD0FF;
}
#board .bt { color: #F7B731; display: flex; justify-content: space-between; border-bottom: 1px solid #3B3170; margin-bottom: 2px; padding-bottom: 1px; }
#board .bt span { color: #FF5A6E; }
#board .row { display: flex; justify-content: space-between; white-space: nowrap; }
#board .st { padding: 0 2px; }
#board .s-wait { color: #F7B731; }
#board .s-in   { color: #7CF29A; }
#board .s-work { color: #0D0E33; background: #FF5A6E; animation: blink .5s steps(1) infinite; }
/* 책상 위 이름표 */
.tag {
  position: absolute;
  transform: translate(-50%, -100%);
  font-size: 5px; line-height: 6px;
  padding: 1.5px 3px 1px;
  border-radius: 1.5px;
  white-space: nowrap;
  box-shadow: 0 1.5px 0 rgba(0,0,0,.45), 1px 1.5px 0 rgba(0,0,0,.6);
  transition: opacity .2s;
}
.tag.hide { opacity: 0; }
.tag.focus { outline: 1px solid #fff; }
/* 머리 위 픽셀 말풍선 */
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  font-size: 6px; line-height: 7px;
  padding: 3px 4px 2px;
  background: #FFFDF5; color: #1E1838;
  border: 1px solid #1E1838;
  box-shadow: 1px 1px 0 #1E1838, 2px 2px 0 rgba(0,0,0,.35);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .15s steps(2);
}
.bubble::after {   /* 픽셀 꼬리 */
  content: ""; position: absolute; left: 50%; bottom: -4px; width: 3px; height: 3px;
  background: #FFFDF5; border: 1px solid #1E1838; border-top: none; border-left: none;
  transform: translateX(-50%) rotate(45deg) scale(.9);
}
.bubble.show { opacity: 1; }
.bubble .who { display: block; font-size: 4.5px; line-height: 5px; margin-bottom: 1px; }
@keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="384" height="256" aria-label="뉴욕 트레이드타워 픽셀 오피스에서 서브에이전트들이 일하는 모습"></canvas>
  <div id="ui">
    <div id="hud">
      <b>NY TRADE TOWER · 52F</b><br>
      <span class="live"><i>●</i> LIVE</span> <span id="clock">--:--:--</span><br>
      오늘 출근 <span id="count">0</span>/3
    </div>
    <div id="board">
      <div class="bt">출근 현황판<span>● ON</span></div>
      <div class="row"><span>상대방 카드</span><span class="st s-wait" id="st0">대기 중</span></div>
      <div class="row"><span>AI 번역</span><span class="st s-wait" id="st1">대기 중</span></div>
      <div class="row"><span>검수 · 점검</span><span class="st s-wait" id="st2">대기 중</span></div>
    </div>
  </div>
</div>
<script>
"use strict";
// ======================================================================= 기본 도구
const W = 384, H = 256;          // 캔버스 한 칸 = 픽셀 하나
const OX = 168, OY = 100;        // 방 원점(뒤쪽 모서리 바닥)이 화면에 놓이는 자리
const T = 16;                    // 타일 가로 반쪽 (타일 = 32 x 16)
const RW = 10, RD = 7, WALL = 92;// 방 크기: 가로 10칸 · 세로 7칸 · 벽 높이
const cv = document.getElementById("c");
const g = cv.getContext("2d");
g.imageSmoothingEnabled = false;

// 아이소메트릭(쿼터뷰) 좌표 → 화면 좌표. x, y 는 타일 단위, z 는 픽셀 단위
function P(x, y, z) { return [OX + (x - y) * T, OY + (x + y) * T / 2 - z]; }
function poly(pts, fill) {
  g.fillStyle = fill; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); g.fill();
}
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function sh(h, k) { const [r, gg, b] = rgb(h); return `rgb(${Math.min(255, r * k) | 0},${Math.min(255, gg * k) | 0},${Math.min(255, b * k) | 0})`; }
// 2번 레퍼런스처럼 윗면은 밝게, 앞면은 조금, 오른쪽 면은 더 어둡게
function C(h) { return [h, sh(h, .8), sh(h, .64)]; }
// 복셀 상자: 윗면 / 앞(+y) 면 / 오른쪽(+x) 면
function box(x, y, z, w, d, h, c) {
  const a = P(x, y, z + h), b = P(x + w, y, z + h), cc = P(x + w, y + d, z + h), dd = P(x, y + d, z + h);
  const e = P(x + w, y + d, z), f = P(x, y + d, z), gg = P(x + w, y, z);
  poly([dd, cc, e, f], c[1]);
  poly([b, cc, e, gg], c[2]);
  poly([a, b, cc, dd], c[0]);
}
function faceY(x0, x1, y, z0, z1, col) { poly([P(x0, y, z1), P(x1, y, z1), P(x1, y, z0), P(x0, y, z0)], col); }
function faceX(x, y0, y1, z0, z1, col) { poly([P(x, y0, z1), P(x, y1, z1), P(x, y1, z0), P(x, y0, z0)], col); }
function topQ(x0, y0, x1, y1, z, col) { poly([P(x0, y0, z), P(x1, y0, z), P(x1, y1, z), P(x0, y1, z)], col); }
function glyph(rows, x, y, col, a) {
  g.globalAlpha = a; g.fillStyle = col;
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === "1") g.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1); });
  g.globalAlpha = 1;
}
const ZG = ["1111", "0010", "0100", "1111"];
const NOTE = ["0011", "0101", "0100", "1100", "1100"];
function hash(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }

// ======================================================================= 창밖: 맨해튼 (4번)
const CW = 152, CH = 87;  // 통유리창 크기 (픽셀)
function layer(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; }
const [skyC, skyX] = layer(CW, CH);
const [bldC, bX] = layer(CW, CH);
const [cityC, cX] = layer(CW, CH);
function R(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

(function paintSky() {
  const bands = ["#4F93DB", "#5D9FE0", "#6DAAE5", "#80B7EA", "#97C5EE", "#B2D4F2", "#CDE3F5", "#E4EEF6"];
  bands.forEach((col, i) => R(skyX, 0, i * 9, CW, CH, col));
})();

const litWindows = [];   // 반짝이는 창문 위치
(function paintBuildings() {
  const x = bX;
  // 먼 빌딩 (옅은 파랑)
  [[44, 34, 10], [60, 40, 8], [86, 30, 7], [96, 42, 9], [128, 38, 8], [30, 44, 8]].forEach(([bx, by, bw]) => R(x, bx, by, bw, 70 - by, "#A3BEDD"));
  // 엠파이어 스테이트 빌딩 (가운데)
  const ex = 76;
  R(x, ex - 10, 30, 20, 40, "#E9D7B0"); R(x, ex + 2, 30, 8, 40, "#D3BD90");
  for (let i = ex - 9; i < ex + 10; i += 2) R(x, i, 32, 1, 38, i > ex + 1 ? "#B49E73" : "#C8B184");
  R(x, ex - 7, 22, 14, 8, "#EEDDB8"); R(x, ex + 1, 22, 6, 8, "#D6C095");
  for (let i = ex - 6; i < ex + 7; i += 2) R(x, i, 23, 1, 7, "#C2AA7C");
  R(x, ex - 5, 16, 10, 6, "#F1E2C0"); R(x, ex + 1, 16, 4, 6, "#D9C49A");
  R(x, ex - 3, 11, 6, 5, "#F3E6C6"); R(x, ex - 3, 14, 6, 1, "#E8C66A"); R(x, ex - 3, 11, 6, 1, "#E8C66A");
  R(x, ex - 1, 5, 3, 6, "#DCD3C2"); R(x, ex, 0, 1, 5, "#BDB6A8");
  // 왼쪽: 어두운 유리 타워
  R(x, 0, 0, 22, 70, "#2C3E6B"); R(x, 16, 0, 6, 70, "#22325A");
  for (let wy = 3; wy < 68; wy += 4) for (let wx = 2; wx < 21; wx += 3) {
    R(x, wx, wy, 2, 2, "#43588A");
    litWindows.push([wx, wy]);
  }
  // 라임스톤 빌딩 + 성조기
  R(x, 22, 14, 18, 56, "#E3CFA8"); R(x, 34, 14, 6, 56, "#CDB88E"); R(x, 22, 14, 18, 2, "#F2E3C3");
  for (let wy = 18; wy < 68; wy += 5) { R(x, 22, wy + 3, 18, 1, "#D5C096"); for (let wx = 24; wx < 39; wx += 4) R(x, wx, wy, 2, 3, "#7E6A4F"); }
  // 성조기: 세로로 걸린 빨강/하양 줄 + 남색 칸 (4번)
  R(x, 22, 19, 17, 1, "#8A8F99");
  for (let fx = 25; fx < 38; fx++) R(x, fx, 20, 1, 24, (fx - 25) % 2 ? "#F4F1EA" : "#C8202F");
  R(x, 25, 20, 7, 10, "#26346B");
  for (let sy = 21; sy < 30; sy += 2) for (let sx = 26 + ((sy >> 1) % 2); sx < 32; sx += 2) R(x, sx, sy, 1, 1, "#F4F1EA");
  // 엠파이어 왼쪽: 파란 유리 · 벽돌
  R(x, 52, 26, 13, 44, "#6E8FC2"); R(x, 60, 26, 5, 44, "#5B7AAF");
  for (let i = 53; i < 64; i += 2) R(x, i, 27, 1, 43, "#86A6D6");
  R(x, 40, 40, 12, 30, "#B5523B"); R(x, 48, 40, 4, 30, "#97432F");
  for (let wy = 43; wy < 68; wy += 4) for (let wx = 41; wx < 51; wx += 3) R(x, wx, wy, 2, 2, "#E7C9A0");
  // 오른쪽: 라임스톤 · 벽돌 · 유리 타워
  R(x, 87, 36, 11, 34, "#E8D6B5"); R(x, 94, 36, 4, 34, "#CFBB92");
  for (let wy = 39; wy < 68; wy += 4) for (let wx = 88; wx < 96; wx += 3) R(x, wx, wy, 2, 2, "#8B7354");
  R(x, 98, 24, 18, 46, "#B65A3C"); R(x, 110, 24, 6, 46, "#94462E"); R(x, 98, 24, 18, 2, "#CF7354");
  for (let wy = 28; wy < 68; wy += 4) for (let wx = 100; wx < 115; wx += 3) R(x, wx, wy, 2, 2, "#F0D7AE");
  R(x, 116, 4, 36, 66, "#34477A"); R(x, 140, 4, 12, 66, "#2A3A66");
  for (let wy = 7; wy < 68; wy += 4) for (let wx = 118; wx < 151; wx += 3) { R(x, wx, wy, 2, 2, "#4C6299"); litWindows.push([wx, wy]); }
  // 작은 성조기 (오른쪽 벽돌 건물)
  R(x, 98, 44, 6, 1, "#8A8F99");
  for (let fy = 45; fy < 51; fy++) R(x, 100, fy, 7, 1, (fy % 2) ? "#C8202F" : "#F4F1EA");
  R(x, 100, 45, 3, 3, "#26346B");
  // 가로수 (1번처럼 동글동글)
  [[44, 62], [66, 63], [92, 62], [122, 63]].forEach(([tx, ty]) => {
    R(x, tx - 3, ty, 7, 6, "#5C9E3E"); R(x, tx - 2, ty - 2, 5, 2, "#79BE52"); R(x, tx + 1, ty + 1, 3, 5, "#467F30"); R(x, tx, ty + 6, 1, 2, "#6B4A2F");
  });
  // 보도 · 도로 · 횡단보도
  R(x, 0, 70, CW, 3, "#CFC6B2"); R(x, 0, 72, CW, 1, "#A99F8C");
  R(x, 0, 73, CW, 14, "#5C606C");
  for (let lx = 2; lx < CW; lx += 10) R(x, lx, 79, 5, 1, "#E9E5DA");
  for (let cx2 = 58; cx2 < 96; cx2 += 4) R(x, cx2, 84, 2, 3, "#E9E5DA");
  // 가로등 · 신호등
  [[52, 1], [104, -1]].forEach(([lx, dir]) => { R(x, lx, 56, 1, 14, "#3A3F4A"); R(x, lx + (dir > 0 ? 0 : -4), 56, 5, 1, "#3A3F4A"); R(x, lx + (dir > 0 ? 4 : -4), 57, 1, 1, "#FFE9A8"); });
  R(x, 82, 60, 1, 10, "#2E323B"); R(x, 81, 58, 3, 4, "#F2B705"); R(x, 82, 59, 1, 1, "#7CF29A");
})();

const clouds = [{ x: 10, y: 8, w: 18, v: 1.6 }, { x: 70, y: 4, w: 24, v: 1.1 }, { x: 120, y: 15, w: 14, v: 2.0 }];
const cars = [
  { x: 0, lane: 74, v: 14, col: "#F6C431" }, { x: 60, lane: 74, v: 14, col: "#F6C431" }, { x: 110, lane: 74, v: 14, col: "#2B3770" },
  { x: 30, lane: 81, v: -11, col: "#F6C431" }, { x: 95, lane: 81, v: -11, col: "#F6C431" }, { x: 140, lane: 81, v: -11, col: "#C8202F" },
];
const peds = Array.from({ length: 7 }, (_, i) => ({ x: hash(i + 3) * CW, v: (hash(i + 11) > .5 ? 1 : -1) * (2 + hash(i + 5) * 2), col: ["#2B3770", "#C8202F", "#F4F1EA", "#7E6A4F", "#6E8FC2"][i % 5] }));

function drawCloud(x, y, w) {
  R(cX, x + 3, y, w - 8, 2, "#FFFFFF"); R(cX, x, y + 2, w, 3, "#FFFFFF"); R(cX, x + 2, y + 5, w - 4, 1, "#DCEBF8");
  R(cX, x + w * .4 | 0, y - 2, w * .3 | 0, 2, "#FFFFFF");
}
function drawCar(c) {
  const x = Math.round(c.x), y = c.lane, flip = c.v < 0;
  R(cX, x, y + 1, 11, 3, c.col); R(cX, x, y + 3, 11, 1, sh(c.col, .75));
  R(cX, x + 3, y - 1, 5, 2, c.col); R(cX, x + 4, y - 1, 3, 1, "#3A4A66");
  if (c.col === "#F6C431") R(cX, x + 4, y - 2, 3, 1, "#FFF6D5");                // 택시 지붕등
  R(cX, flip ? x : x + 10, y + 1, 1, 1, "#FFF6D5");                             // 헤드라이트
  R(cX, x + 1, y + 4, 2, 1, "#1B1B22"); R(cX, x + 8, y + 4, 2, 1, "#1B1B22");    // 바퀴
}
function paintCity(t, dt) {
  cX.drawImage(skyC, 0, 0);
  clouds.forEach(c => { c.x += c.v * dt; if (c.x > CW + 4) c.x = -c.w - 4; drawCloud(Math.round(c.x), c.y, c.w); });
  cX.drawImage(bldC, 0, 0);
  // 창문 불빛이 천천히 켜졌다 꺼져요
  litWindows.forEach(([wx, wy], i) => { if (hash(i * 7 + Math.floor(t / 4 + hash(i) * 9)) > .72) R(cX, wx, wy, 2, 2, "#F6C431"); });
  // 엠파이어 꼭대기 빨간 불
  if (Math.floor(t * 1.5) % 2) R(cX, 76, 0, 1, 1, "#FF4A5A");
  peds.forEach(p => { p.x += p.v * dt; if (p.x > CW + 2) p.x = -2; if (p.x < -2) p.x = CW + 2; const b = Math.floor(t * 4 + p.x) % 2; R(cX, Math.round(p.x), 67 + b, 1, 3, p.col); R(cX, Math.round(p.x), 66 + b, 1, 1, "#F2C6A0"); });
  cars.forEach(c => { c.x += c.v * dt; if (c.v > 0 && c.x > CW + 12) c.x = -14 - hash(c.x | 0) * 30; if (c.v < 0 && c.x < -14) c.x = CW + 12 + hash(c.x | 0) * 30; drawCar(c); });
  // 유리 반사
  cX.fillStyle = "rgba(220,208,255,.07)"; cX.fillRect(0, 0, CW, CH);
  cX.fillStyle = "rgba(255,255,255,.10)";
  for (const s of [18, 26, 92]) { cX.beginPath(); cX.moveTo(s, 0); cX.lineTo(s + 10, 0); cX.lineTo(s - 30, CH); cX.lineTo(s - 40, CH); cX.fill(); }
}

// ======================================================================= 서브에이전트 (3번 캐릭터)
const AG = [
  { name: "상대방 카드 담당", short: "상대방 카드", color: "#F7B731", ink: "#1E1838", desk: 0.6,
    hair: "#1B1626", long: true,  shirt: "#F4F1EA", pants: "#2B3770", headset: "#F4F1EA", cup: "#E8E4F5", mug: "#2B3770", skin: "#F2C6A0" },
  { name: "AI 번역 담당",     short: "AI 번역",     color: "#5B9BE6", ink: "#FFFFFF", desk: 3.7,
    hair: "#6B3E26", long: false, shirt: "#B9A6EE", pants: "#3A3550", headset: "#2B2840", cup: "#8A73D1", mug: "#2B3770", skin: "#E8B48C" },
  { name: "검수 · 점검 담당", short: "검수 · 점검", color: "#E0414F", ink: "#FFFFFF", desk: 6.8,
    hair: "#2A2235", long: false, shirt: "#2B3770", pants: "#1E1838", headset: "#E0414F", cup: "#F4F1EA", mug: "#2B3770", skin: "#F5CFAE" },
];
const DESK_Y = 1.6, DESK_D = 1.1, DESK_W = 2.6, DESK_Z = 20, SEAT_Y = 3.35, DOOR_Y = 5.9;
AG.forEach((a, i) => {
  a.i = i; a.cx = a.desk + DESK_W / 2;
  a.state = "wait"; a.start = 0.8 + i * 2.6;
  a.x = -0.6; a.y = DOOR_Y; a.dir = "x";
  a.workUntil = 0; a.scroll = hash(i * 13) * 40;
  a.nextSip = 6 + i * 4; a.sipUntil = 0;
  a.phase = hash(i + 21) * 2;
});

// 이번 브라우저 세션에서 이미 출근했다면 바로 자리에 앉아 있어요
let arrivedBefore = false;
try { arrivedBefore = sessionStorage.getItem("bn_office_arrived") === "1"; } catch (e) { /* 저장소를 못 써도 괜찮아요 */ }
if (arrivedBefore) AG.forEach(a => { a.state = "idle"; a.x = a.cx; a.y = SEAT_Y; });

// ======================================================================= 그리기: 방
function drawRoom() {
  // 공중에 떠 있는 디오라마 그림자 (2번)
  const [sx, sy] = P(RW / 2, RD / 2, -34);
  const gr = g.createRadialGradient(sx, sy, 10, sx, sy, 170);

function seated(a, t, now) {
  const x = a.cx, y = SEAT_Y, work = isWorking(a);

  box(x - 0.05, y + 0.05, 0, 0.1, 0.1, 9, CH);                                  // 의자 다리

function update(t, dt, now) {
  let arrived = 0;
  AG.forEach(a => {
    if (a.state === "wait" && t >= a.start) { a.state = "walk"; a.walkFrom = t; }
    if (a.state === "walk") {
      const d = (t - a.walkFrom) * 1.6, seg1 = a.cx + 0.6, seg2 = DOOR_Y - SEAT_Y;
      if (d < seg1) { a.x = -0.6 + d; a.y = DOOR_Y; a.dir = "x"; }
      else if (d < seg1 + seg2) { a.x = a.cx; a.y = DOOR_Y - (d - seg1); a.dir = "y"; }
      else { a.state = "idle"; a.x = a.cx; a.y = SEAT_Y; say(a.i, "출근 완료! 오늘도 화이팅", 2000); }
    }
    if (a.state === "idle") {
      arrived++;
      if (t > a.nextSip && !isWorking(a)) { a.sipUntil = t + 2.2; a.nextSip = t + 9 + hash(Math.floor(t) + a.i) * 12; }
      a.scroll += dt * (isWorking(a) ? 16 : 1.2);

}

let lastBoard = "", lastFit = 0;

  if (now - lastFit > 1000) { lastFit = now; fit(); }   // Streamlit 이 높이를 되돌려 놓으면 다시 맞춰요
  const d = new Date();
  document.getElementById("clock").textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
}

function draw(t, dt, now) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  drawRoom();
  drawWindow(t, dt);
  drawWallStuff(t);
  plant(0.2, 0.3, true, t);
  plant(RW - 0.7, 0.35, true, t);
  AG.forEach(a => desk(a, t));
  AG.forEach(a => { if (a.state === "idle") seated(a, t, now); });
  plant(RW - 0.75, RD - 0.9, true, t);
  AG.filter(a => a.state === "walk").sort((p, q) => (p.x + p.y) - (q.x + q.y)).forEach(a => walker(a, t));
  // 포커스: 일하는 에이전트 자리만 밝게
  if (focus.level > 0.02 && focus.i >= 0) {
    const [fx, fy] = P(AG[focus.i].cx, 2.6, 26);
    const gr = g.createRadialGradient(fx, fy, 34, fx, fy, 120);
    gr.addColorStop(0, "rgba(8,8,35,0)"); gr.addColorStop(1, `rgba(8,8,35,${0.5 * focus.level})`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const [ax, ay] = P(AG[focus.i].cx, SEAT_Y, 46);           // 머리 위 화살표
    const bounce = Math.floor(now / 250) % 2;
    glyph(["11111", "01110", "00100"], ax - 2, ay + bounce, "#F7B731", focus.level);
  }
}

// ---------------------------------------------------------------- 바깥 화면(app.py)과 연결
// 탭 순서: 0 상대방 카드 · 1 AI 번역 · 2 검수 요청문 · 3 보관함 · 4 보내기 전 점검
const TAB_MSG = [
  [0, "상대방 카드 펼쳐 보는 중!"],
  [1, "번역할 문장 기다리는 중~"],
  [2, "검수 요청문 준비 완료!"],
  [1, "보관함 문장 정리 중..."],
  [2, "보내기 전 점검 대기 중!"],
];
// 버튼 key(app.py) → [에이전트, 작업 중 말풍선, 결과별 말풍선, 결과 알림이 없을 때]
const BTN = {
  c_save: [0, "거래처 카드 저장 중!",       { success: "카드 저장 완료!", error: "앗, 빈칸을 확인해 주세요!" }, "카드 정리 끝!"],
  t_go:   [1, "비즈니스 번역 가동 중...",   { error: "번역이 막혔어요. 안내를 확인해 주세요!", warning: "조금 길어졌어요. 다듬어 볼까요?" }, "번역 초안 완성! 고쳐서 저장하세요"],
  t_save: [1, "보관함에 저장 중!",          { success: "보관함 저장 완료!", error: "저장이 안 됐어요!" }, "보관함 저장 완료!"],
  r_go:   [2, "검수 요청문 작성 중!",       { error: "원문을 먼저 써 주세요!" }, "요청문 완성! 복사해 가세요"],
  p_save: [1, "문장 보관 중!",              { success: "보관 완료!", error: "저장이 안 됐어요!" }, "보관 완료!"],
  e_go:   [2, "발송 전 꼼꼼히 검수 중!",    { success: "점검 통과! 보내도 좋아요", error: "확인할 곳이 있어요! 안내를 봐 주세요", warning: "말투를 한 번 더 볼까요?", info: "점검 메모를 확인해 주세요" }, "점검 끝!"],
};
let pdoc = null, pending = null, lastTab = -1;
function parentDoc() { try { const d = window.parent.document; return d && d.body ? d : null; } catch (e) { return null; } }
function selectedTab(doc) { return [...doc.querySelectorAll('[data-testid="stTab"]')].findIndex(el => el.getAttribute("aria-selected") === "true"); }
function alertKind(el) {
  const s = el.innerHTML;
  for (const k of ["Error", "Warning", "Success", "Info"]) if (s.includes("stAlertContent" + k)) return k.toLowerCase();
  return null;
}
function pollPending(now) {
  if (!pending || !pdoc) return;
  const running = pdoc.querySelector('[data-testid="stStatusWidget"]');
  if (now - pending.at < 1300 || (running && now - pending.at < 30000)) return;   // 아직 실행 중
  const panels = pdoc.querySelectorAll('[data-testid="stTabPanel"]');
  const panel = panels[Math.max(0, selectedTab(pdoc))] || pdoc;
  const kinds = [...panel.querySelectorAll('[data-testid="stAlert"]')].map(alertKind);
  const [i, , byKind, fallback] = pending.spec;
  const k = ["error", "warning", "success", "info"].find(x => kinds.includes(x) && byKind[x]);
  AG[i].workUntil = now + 900;
  say(i, k ? byKind[k] : fallback, 2600);
  focus.until = now + 1800;
  pending = null;
}
function hookParent() {
  pdoc = parentDoc();
  if (!pdoc) return;   // 바깥 화면을 못 읽어도 오피스는 혼자 잘 움직여요
  lastTab = selectedTab(pdoc);
  let queued = false;
  new MutationObserver(() => {
    if (queued) return; queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const i = selectedTab(pdoc);
      if (i !== lastTab && i >= 0) { lastTab = i; const [ag, msg] = TAB_MSG[i] || TAB_MSG[0]; work(ag, 1800, msg); }
    });
  }).observe(pdoc.body, { subtree: true, attributes: true, attributeFilter: ["aria-selected"] });
  pdoc.addEventListener("click", e => {
    const btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    const holder = btn.closest('[class*="st-key-"]');
    const key = holder && [...holder.classList].find(c => c.startsWith("st-key-"));
    const spec = key && BTN[key.slice(7)];
    if (!spec) return;
    pending = { spec, at: performance.now() };
    work(spec[0], 30000, spec[1]);
  }, true);
}

// ---------------------------------------------------------------- 크기 맞추기 · 반복
const stage = document.getElementById("stage");
function fit() {
  ui.style.transform = `scale(${stage.clientWidth / W})`;
  // 휴대폰처럼 폭이 좁으면 iframe 높이도 같이 줄여서 아래 빈칸이 생기지 않게
  try {
    const f = window.frameElement;
    if (f) {
      const h = (Math.ceil(stage.getBoundingClientRect().height) + 2) + "px";
      const box = f.closest('[data-testid="stElementContainer"]');
      if (f.style.height !== h) f.style.height = h;
      if (box && box.style.height !== h) {   // Streamlit 은 flex-basis 로 높이를 고정해요
        box.style.setProperty("height", h, "important");
        box.style.setProperty("flex", "0 0 " + h, "important");
      }
    }
  } catch (e) {}
}
new ResizeObserver(fit).observe(stage); fit();
hookParent();
let t0 = performance.now(), last = t0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  update(t, dt, now);
  draw(t, dt, now);
  updateUI(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
